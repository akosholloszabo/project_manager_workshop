version: "3.9"

services:
  db:
    image: postgres:16
    container_name: project-manager-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: project_manager
      POSTGRES_USER: pm_user
      POSTGRES_PASSWORD: pm_password
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    name: project-manager-postgres-data

